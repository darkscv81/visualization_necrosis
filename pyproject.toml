[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "necrosis-analysis"
version = "0.1.0"
description = "Research workflow for longitudinal MRI perfusion and radiation dose"
requires-python = ">=3.11,<3.15"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
